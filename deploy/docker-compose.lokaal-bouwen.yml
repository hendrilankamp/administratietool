# Alternatief zonder GitHub: bouw het image op de NAS zelf.
# Gebruik deze map (deploy/) uit de code als project; data/ en backup/ komen naast deploy/.
services:
  boekhouding:
    build: ..
    image: boekhouding-medialan:lokaal
    container_name: boekhouding
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - ../data:/app/data
      - ../backup:/backup-extern
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
