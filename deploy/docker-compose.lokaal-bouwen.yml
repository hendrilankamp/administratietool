# Alternatief zonder GitHub: bouw het image op de NAS zelf.
# Zet de projectmap in /volume1/docker/boekhouding-app en kies dat pad bij Container Manager → Project.
services:
  boekhouding:
    build: ..
    image: boekhouding-medialan:lokaal
    container_name: boekhouding
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - /volume1/docker/boekhouding:/app/data
      - /volume1/backup/boekhouding:/backup-extern
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
