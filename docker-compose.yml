# ================================================================
# Boekhouding Medialan – Synology Container Manager
#
# 1. File Station: maak een projectmap (bv. docker/boekhoud) met daarin de submappen  data  en  backup
#    (Synology maakt ontbrekende mappen niet zelf aan; de rechten zet de container wel zelf goed)
# 2. Container Manager → Project → Maken → kies die projectmap → "docker-compose.yml maken" → plak dit bestand
#    Sla de stap "webportaal via Web Station" over (die bezet anders dezelfde poort)
# 3. Open http://<ip-van-je-nas>:3000
# ================================================================
services:
  boekhouding:
    image: ghcr.io/hendrilankamp/administratietool:latest
    container_name: boekhouding
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - ./data:/app/data             # database, facturen, lokale backups
      - ./backup:/backup-extern      # versleutelde backups → laat Hyper Backup deze map kopiëren
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                     # alleen nodig bij het opstarten om mapsrechten te zetten
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
