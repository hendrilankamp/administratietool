# ================================================================
# Boekhouding Medialan – Synology Container Manager
#
# 1. Container Manager → Project → Maken → kies een (lege) projectmap, bv. docker/Boekhoudsoftware
# 2. Bron: "docker-compose.yml maken" → plak dit bestand
# 3. Open http://<ip-van-je-nas>:3000
# De mappen data/ en backup/ worden bij de eerste start automatisch in de projectmap aangemaakt.
# ================================================================
services:
  boekhouding:
    image: ghcr.io/hendrilankamp/administratietool:latest
    container_name: boekhouding
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - ./data:/app/data             # database, facturen, lokale backups
      - ./backup:/backup-extern      # versleutelde backups → laat Hyper Backup deze map kopiëren
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                     # alleen nodig bij het opstarten om mapsrechten te zetten
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
